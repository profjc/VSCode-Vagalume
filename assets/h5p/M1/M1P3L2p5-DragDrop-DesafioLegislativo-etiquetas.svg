<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <style>
      .bg-vagalume { fill: #FDF8F4; }
      .texto-alvo { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 500; fill: #261810; }
      .caixa-alvo { fill: #FFFFFF; stroke: rgba(91, 57, 37, 0.2); stroke-width: 1.5; rx: 12px; }
      .caixa-drop-vazia { fill: #FFF2E6; stroke: #D96F1A; stroke-width: 2; stroke-dasharray: 6 4; rx: 12px; }
    </style>
  </defs>

  <!-- Fundo -->
  <rect width="900" height="650" class="bg-vagalume" />

  <!-- LINHA 1 (y: 20 a 110) -->
  <rect x="20" y="20" width="520" height="90" class="caixa-alvo" />
  <!-- Apenas a palavra 'adolescentes' passada para baixo, mantendo o resto como na original -->
  <text x="40" y="55" class="texto-alvo">Instituiu o princípio da Prioridade Absoluta para crianças e</text>
  <text x="40" y="80" class="texto-alvo">adolescentes.</text>
  <rect x="560" y="20" width="310" height="90" class="caixa-drop-vazia" />

  <!-- LINHA 2 (y: 140 a 230) -->
  <rect x="20" y="140" width="520" height="90" class="caixa-alvo" />
  <text x="40" y="180" class="texto-alvo">Criou o Conselho Tutelar e definiu medidas de proteção e</text>
  <text x="40" y="205" class="texto-alvo">socioeducativas.</text>
  <rect x="560" y="140" width="310" height="90" class="caixa-drop-vazia" />

  <!-- LINHA 3 (y: 260 a 350) -->
  <rect x="20" y="260" width="520" height="90" class="caixa-alvo" />
  <text x="40" y="300" class="texto-alvo">Proibiu o uso de castigos físicos ou tratamentos cruéis sob</text>
  <text x="40" y="325" class="texto-alvo">pretexto de educação.</text>
  <rect x="560" y="260" width="310" height="90" class="caixa-drop-vazia" />

  <!-- LINHA 4 (y: 380 a 470) -->
  <rect x="20" y="380" width="520" height="90" class="caixa-alvo" />
  <text x="40" y="420" class="texto-alvo">Estabeleceu diretrizes específicas para o desenvolvimento</text>
  <text x="40" y="445" class="texto-alvo">integral de crianças de 0 a 6 anos.</text>
  <rect x="560" y="380" width="310" height="90" class="caixa-drop-vazia" />

  <!-- LINHA 5 (y: 500 a 590) -->
  <rect x="20" y="500" width="520" height="110" class="caixa-alvo" />
  <text x="40" y="535" class="texto-alvo">Criou mecanismos para coibir a violência doméstica e classificou</text>
  <text x="40" y="560" class="texto-alvo">o homicídio contra menores de 14 anos como crime hediondo.</text>
  <rect x="560" y="510" width="310" height="90" class="caixa-drop-vazia" />
</svg>
