<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>[[TITULO]]</title>
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<link rel="stylesheet" href="../../assets/css/vagalume-tema.css">
<style>
  /* ============================================================
     ESPELHO DOS DOCUMENTOS "SEQUENCIA DIDATICA" (PDF)
     Modelo reutilizavel: cabecalho (logos Vaga Lume + Van Leer),
     corpo (conteudo da pagina do Moodle) e rodape institucional.
     Nao vai para o Moodle — e a capa-molde da versao em PDF.
     ============================================================ */
  html, body { background-color: #f4f4f4; }
  body { font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; color: #261810; margin: 0; }

  /* ---- Folha do documento (visual de tela) ---- */
  .doc { background-color: #ffffff; max-width: 210mm; margin: 20px auto; padding: 14mm; box-shadow: 0 2px 14px rgba(0,0,0,0.12); }

  /* ---- Cabecalho ---- */
  .doc-header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; border-bottom: 2px solid #d96f1a; padding-bottom: 10px; margin-bottom: 18px; }
  .doc-header .titulo { font-size: 1.3rem; font-weight: 700; color: #5b3925; margin: 0; line-height: 1.2; }
  .doc-header .logos { display: flex; align-items: flex-end; gap: 14px; flex-shrink: 0; }
  .doc-header .logos img { height: 50px; width: auto; display: block; }
  .doc-header .logos img.vanleer { height: 58px; }

  /* ---- Rodape ---- */
  .doc-footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; border-top: 1px solid #e6d5c3; padding-top: 8px; margin-top: 20px; font-size: 0.7rem; color: #5b3925; }

  /* ---- Impressao / PDF (A4) ---- */
  @media print {
    @page { size: A4; margin: 12mm; }
    html, body { background-color: #ffffff; }
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    .doc { max-width: 100%; margin: 0; padding: 0; box-shadow: none; }

    .container { max-width: 100% !important; padding-left: 0 !important; padding-right: 0 !important; }
    .vagalume-pagina { font-size: 12pt; line-height: 1.42 !important; }
    .py-4 { padding-top: 0 !important; padding-bottom: 0 !important; }
    .card, .vagalume-destaque-bloco, .vagalume-h5p-card { box-shadow: none !important; break-inside: avoid; page-break-inside: avoid; }
    .card-body { padding: 0.9rem !important; }
    .mb-4 { margin-bottom: 0.7rem !important; }
    .mb-3 { margin-bottom: 0.5rem !important; }
    .vagalume-destaque-bloco { margin-bottom: 0.7rem !important; padding: 0.9rem !important; }
    .row > [class*="col-md-6"] { -ms-flex: 0 0 50% !important; flex: 0 0 50% !important; max-width: 50% !important; }
    li, p { orphans: 3; widows: 3; }
    ol.list-unstyled > li { break-inside: avoid; page-break-inside: avoid; }
    .h4, .h5 { break-after: avoid; page-break-after: avoid; }
  }
</style>
</head>
<body>
  <div class="doc">

    <!-- ===== CABECALHO DO DOCUMENTO (Vaga Lume + Van Leer) ===== -->
    <header class="doc-header">
      <div>
        <p class="titulo mb-0">[[TITULO]]</p>
      </div>
      <div class="logos">
        <img src="../../assets/images/logos/vagalume-pdf.png" alt="Logotipo Vaga Lume" width="51" height="50">
        <img class="vanleer" src="../../assets/images/logos/vanleer-pdf.png" alt="Logotipo Fundação Van Leer" width="42" height="58">
      </div>
    </header>

    <!-- ===== CORPO: conteudo da Sequencia Didatica (injetado pelo script) ===== -->
    <main class="doc-body">
<!-- CONTEUDO-DA-SEQUENCIA -->
    </main>

    <!-- ===== RODAPE DO DOCUMENTO (div: a tag <footer> é ocultada pelo CSS do tema) ===== -->
    <div class="doc-footer">
      <span>Associação Vaga Lume em parceria com a Fundação Van Leer</span>
    </div>

  </div>
</body>
</html>
